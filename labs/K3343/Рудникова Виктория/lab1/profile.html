<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { padding-top: 4.5rem; background: #f5f5f7; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">RentEasy</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Поиск</a></li>
            <li class="nav-item"><span class="nav-link active">Личный кабинет</span></li>
          </ul>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="login_register.html#login">Вход</a>
            <a class="btn btn-primary btn-sm" href="login_register.html#register">Регистрация</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-4">Личный кабинет</h1>
              <p class="mb-1 text-muted small">Имя</p>
              <p class="mb-3" id="profileName">—</p>
              <p class="mb-1 text-muted small">Email</p>
              <p class="mb-0" id="profileEmail">—</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="border-top py-3 mt-5">
      <div class="container text-muted small text-center">
        © 2026 RentEasy - сервис аренды недвижимости
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        document.getElementById("profileName").textContent = params.get("name") || "—";
        document.getElementById("profileEmail").textContent = params.get("email") || "—";
      })();
    </script>
  </body>
</html>
